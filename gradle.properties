# Project: SQ Susurros de Querubín
# Gradle properties para Android 15 + Compose + Hilt

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.js.ir.metrics=true
kotlin.js.ir.dont-download-dependencies=true

# Compose
androidx.compose.compiler.report=true
androidx.compose.compiler.metrics=true

# Hilt
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.correct.defaults.for.changed.modules=true

# Room (si se usa)
room.schemaLocation=project.projectDir/schemas
room.incremental=true
room.expandingProjectStruct=true

# Testing
android.test.useMonitoringInstrumentationRunner=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
